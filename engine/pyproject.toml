[project]
name = "deepgravity-core"
version = "0.1.0"
description = "DeepGravity ground-up engine core (dev build)"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "numpy",
    "cryptography",
    "faiss-cpu>=1.15.1",
]
# Rack (fastapi/uvicorn/httpx/pydantic/numpy) already present in /srv/dg-dev/.venv.
# Dependencies pinned by uv as the build progresses (uv.lock is the source of truth).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepgravity_core"]

[tool.uv]
package = true
